apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fraud-detection-hpa

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fraud-detection    # must match Deployment name exactly

  minReplicas: 2             # never go below 2 (availability floor)
  maxReplicas: 5             # never go above 5 (cost ceiling)

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # add a pod when average CPU hits 70%