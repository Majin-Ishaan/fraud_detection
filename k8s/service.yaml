apiVersion: v1
kind: Service
metadata:
  name: fraud-detection-service

spec:
  type: NodePort             # makes it reachable from your host machine (Minikube)
  selector:
    app: fraud-detection     # routes traffic to pods with this label — must match Deployment

  ports:
    - protocol: TCP
      port: 80               # port the Service listens on inside the cluster
      targetPort: 8000       # port on the pod (your FastAPI app)
      nodePort: 30080        # port on your host machine — hit localhost:30080